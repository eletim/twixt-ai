[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twixt-ai"
version = "0.0.1"
description = "An AI-first Twixt engine and experimentation stack"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
models = ["torch>=2"]
dev = ["pytest>=8", "torch>=2"]

[project.scripts]
twixt-ai-benchmark = "twixt_ai.evaluation.benchmark_cli:main"
twixt-ai-engine-benchmark = "twixt_ai.game.performance_cli:main"
twixt-ai-inference-benchmark = "twixt_ai.evaluation.inference_cli:main"
twixt-ai-encoding-comparison = "twixt_ai.evaluation.encoding_comparison_cli:main"
twixt-ai-selfplay-benchmark = "twixt_ai.evaluation.performance_cli:main"
twixt-ai-match = "twixt_ai.evaluation.cli:main"
twixt-ai-selfplay = "twixt_ai.selfplay.cli:main"
twixt-ai-mini-dataset-experiment = "twixt_ai.selfplay.experiment_cli:main"
twixt-ai-mini-training-experiment = "twixt_ai.training.mini_experiment_cli:main"
twixt-ai-matched-encoding-training = "twixt_ai.training.encoding_experiment_cli:main"
twixt-ai-mini-strength-evaluation = "twixt_ai.evaluation.mini_strength_cli:main"
twixt-ai-mini-generations = "twixt_ai.training.generations_cli:main"
twixt-ai-mini-report = "twixt_ai.training.inspection_cli:main"
twixt-ai-dataset = "twixt_ai.training.cli:main"
twixt-ai-train = "twixt_ai.training.train_cli:main"
twixt-ai-web = "twixt_ai.backend.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"twixt_ai.ui" = ["*.html", "*.js", "*.css"]
