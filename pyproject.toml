[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twixt-ai"
version = "0.0.1"
description = "An AI-first Twixt engine and experimentation stack"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
twixt-ai-benchmark = "twixt_ai.evaluation.benchmark_cli:main"
twixt-ai-match = "twixt_ai.evaluation.cli:main"
twixt-ai-selfplay = "twixt_ai.selfplay.cli:main"
twixt-ai-web = "twixt_ai.backend.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"twixt_ai.ui" = ["*.html", "*.js", "*.css"]
