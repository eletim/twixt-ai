<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Twixt</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Local game</p>
          <h1>Twixt</h1>
        </div>
        <button id="reset" type="button">Reset game</button>
      </header>
      <section class="game" aria-labelledby="status">
        <p id="status" role="status" aria-live="polite">Loading game…</p>
        <div class="board-frame">
          <svg id="board" role="grid" aria-label="Twixt board"></svg>
        </div>
        <p id="message" role="alert" aria-live="assertive"></p>
      </section>
      <footer><span class="red-key">Red</span> connects top to bottom. <span class="black-key">Black</span> connects left to right.</footer>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
